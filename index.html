<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي الطلاقة النحوية - CAMeL Tools</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1E3A8A; --secondary: #4D7C0F; --bg: #F3F4F6; --card: #FFFFFF; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: var(--card); padding: 2.5rem; border-radius: 20px; box-shadow: 0 15px 30px rgba(0,0,0,0.15); width: 90%; max-width: 650px; text-align: center; border-top: 5px solid var(--primary); }
        h1 { color: var(--primary); }
        .btn { background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 10px; font-size: 1.2rem; cursor: pointer; margin: 8px; font-family: 'Tajawal', sans-serif; font-weight: bold; }
        .btn:hover { background: #162861; }
        .option-btn { background: var(--secondary); display: block; width: 100%; margin: 15px 0; font-size: 1.4rem; padding: 18px; border-radius: 12px; }
        #timer-bar-container { width: 100%; background: #E5E7EB; border-radius: 10px; height: 20px; margin: 20px 0; overflow: hidden; display: none; }
        #timer-bar { height: 100%; background: #10B981; width: 100%; transition: width 1s linear; }
        .hidden { display: none !important; }
        .question-text { font-size: 1.8rem; font-weight: bold; margin: 30px 0; color: var(--primary); }
    </style>
</head>
<body>

<div class="container" id="menu-screen">
    <h1>تحدي الطلاقة النحوية</h1>
    <p>أسئلة مشتقة ومحللة صرفياً عبر مكتبة CAMeL Tools</p>
    <button class="btn" onclick="startGame()">بدء التحدي الزمني</button>
</div>

<div class="container hidden" id="game-screen">
    <div style="display: flex; justify-content: space-between; font-weight: bold;">
        <span id="stage-display">المرحلة: 1 / 10</span>
        <span id="score-display">النقاط: 0 / 10</span>
    </div>
    <div id="timer-bar-container"><div id="timer-bar"></div></div>
    <div id="time-text" style="font-size:1.3rem; font-weight:bold; color:#EF4444;">60 ثانية</div>
    <div class="question-text" id="question-text">جاري تحضير الأسئلة...</div>
    <div id="options-container"></div>
</div>

<div class="container hidden" id="result-screen">
    <h2 id="result-title"></h2>
    <p id="result-desc" style="font-size:1.3rem;"></p>
    <button class="btn" onclick="location.reload()">إعادة اللعب</button>
</div>

<script>
    let questions = [];
    let currentQIndex = 0;
    let score = 0;
    let timeLeft = 60;
    let timerInterval;

    async function startGame() {
        document.getElementById('menu-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('timer-bar-container').style.display = 'block';
        
        // جلب الأسئلة المولدة بواسطة بايثون
        try {
            const res = await fetch('easy_bank.json');
            let data = await res.json();
            questions = data.sort(() => 0.5 - Math.random()).slice(0, 10);
        } catch(e) {
            alert('جاري تجهيز بنك الأسئلة من السيرفر، يرجى تحديث الصفحة بعد دقيقة.');
            return;
        }
        
        startStage();
    }

    function startStage() {
        currentQIndex = 0;
        score = 0;
        timeLeft = 60;
        updateScoreBoard();
        loadQuestion();
        
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('time-text').innerText = timeLeft + " ثانية";
            document.getElementById('timer-bar').style.width = (timeLeft / 60) * 100 + '%';
            if (timeLeft <= 0) endGame();
        }, 1000);
    }

    function loadQuestion() {
        if (currentQIndex >= questions.length) { endGame(); return; }
        
        const qData = questions[currentQIndex];
        document.getElementById('question-text').innerText = qData.q;
        const optsContainer = document.getElementById('options-container');
        optsContainer.innerHTML = '';
        
        let opts = [...qData.options].sort(() => Math.random() - 0.5);
        opts.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn option-btn';
            btn.innerText = opt;
            btn.onclick = () => {
                if (opt === qData.answer) score++;
                currentQIndex++;
                updateScoreBoard();
                loadQuestion();
            };
            optsContainer.appendChild(btn);
        });
    }

    function updateScoreBoard() {
        document.getElementById('score-display').innerText = `النقاط: ${score} / ${questions.length}`;
    }

    function endGame() {
        clearInterval(timerInterval);
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('result-title').innerText = score >= 8 ? "ممتاز! اجتزت التحدي" : "انتهى الوقت!";
        document.getElementById('result-desc').innerText = `نتيجة الاختبار: ${score} من أصل ${questions.length}`;
    }
</script>
</body>
</html>
