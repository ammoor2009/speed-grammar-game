name: CAMeL Tools Automatic Question Generator

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install CAMeL Tools & Light Data
        run: |
          python -m pip install --upgrade pip
          pip install camel-tools
          camel_data -i light

      - name: Run Question Generator
        run: python generate_questions.py

      - name: Commit and Push Updated JSON
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add easy_bank.json
          git commit -m "تحديث تلقائي لبنك الأسئلة عبر CAMeL Tools" || exit 0
          git push origin HEAD
